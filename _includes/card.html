{%- include thumb.html post=include.post -%}
<article class="card" data-title="{{ include.post.title | downcase | escape }}" data-tags="{{ include.post.tags | join: '|' | escape }}">
  <a class="card-img" href="{{ include.post.url | relative_url }}" aria-hidden="true" tabindex="-1">
    {% if thumb != "" %}<img src="{{ thumb | replace: '/s1600/', '/s400/' }}" alt="" loading="lazy">{% else %}<span class="ph">{{ include.post.title | slice: 0 }}</span>{% endif %}
  </a>
  <div class="card-body">
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p class="meta">{{ site.author }} · {{ include.post.date | date: "%d/%m/%Y" }}</p>
  </div>
</article>
